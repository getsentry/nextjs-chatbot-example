allowBuilds:
  '@sentry-internal/node-cpu-profiler': true
  '@sentry/cli': true
  esbuild: false

# Force patched versions of vulnerable transitive deps (dependabot). Scoped to
# the vulnerable version ranges so other consumers keep their existing versions.
overrides:
  '@isaacs/brace-expansion@<=5.0.0': '5.0.1'
  'dompurify@>=3.1.3 <=3.3.1': '3.4.8'
  'esbuild@<0.25.0': '0.25.12'
  'kysely@>=0.26.0 <=0.28.11': '0.28.12'
  'lodash-es@<4.18.0': '4.18.1'
  'markdown-it@>=13.0.0 <14.1.1': '14.2.0'
  'mdast-util-to-hast@>=13.0.0 <13.2.1': '13.2.1'
  'mermaid@>=11.0.0-alpha.1 <=11.14.0': '11.15.0'
  'minimatch@>=10.0.0 <10.2.1': '10.2.5'
  'postcss@<8.5.10': '8.5.15'
  'uuid@<11.1.1': '11.1.1'
  'ws@>=8.0.0 <8.20.1': '8.21.0'
